name: Build iOS IPA (Local Sideload)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Application (Release, No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r -y QuanLyChiTieu.ipa Payload
          ls -lh QuanLyChiTieu.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyChiTieu-iOS-IPA
          path: build/ios/QuanLyChiTieu.ipa
          retention-days: 14
